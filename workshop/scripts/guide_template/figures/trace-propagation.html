<figure class="diagram">
  <div class="diagram-scroll">
    <svg viewBox="0 0 740 216" role="img" aria-labelledby="fig-prop-title fig-prop-desc">
      <title id="fig-prop-title">How one trace ID reaches three services</title>
      <desc id="fig-prop-desc">Checkout starts a trace and sends its ID in the traceparent HTTP header. Inventory and Payment read that header, so the spans all three services record belong to the same trace. Nothing in the application code passes a correlation ID by hand.</desc>

      <rect class="d-surface" x="8" y="52" width="150" height="64" rx="8" stroke-width="1"/>
      <text class="d-title" x="24" y="76">Checkout</text>
      <text class="d-mono-soft" x="24" y="94">starts the trace</text>
      <rect class="d-ok-soft" x="24" y="100" width="118" height="8" rx="3" stroke-width="1"/>

      <path class="d-line" stroke-width="1.4" d="M158 74 h84 l0 -18 h58"/>
      <path class="d-line" stroke-width="1.4" d="M158 96 h84 l0 62 h58"/>
      <path class="d-line" stroke-width="1.4" d="M294 50 l-6 6 6 6" />
      <path class="d-line" stroke-width="1.4" d="M294 152 l-6 6 6 6" />
      <text class="d-mono-soft" x="166" y="42">traceparent: 00-4bf9…</text>
      <text class="d-mono-soft" x="166" y="112">the same header</text>

      <rect class="d-surface" x="300" y="24" width="150" height="64" rx="8" stroke-width="1"/>
      <text class="d-title" x="316" y="48">Inventory</text>
      <text class="d-mono-soft" x="316" y="66">joins the trace</text>
      <rect class="d-ok-soft" x="316" y="72" width="60" height="8" rx="3" stroke-width="1"/>

      <rect class="d-surface" x="300" y="126" width="150" height="76" rx="8" stroke-width="1"/>
      <text class="d-title" x="316" y="150">Payment</text>
      <text class="d-mono-soft" x="316" y="168">joins the trace</text>
      <rect class="d-ok-soft" x="316" y="174" width="118" height="8" rx="3" stroke-width="1"/>
      <rect class="d-bad-soft" x="330" y="186" width="70" height="8" rx="3" stroke-width="1"/>

      <path class="d-hair" stroke-width="1" d="M470 58 h40 M470 160 h40"/>
      <rect class="d-info-soft" x="516" y="40" width="216" height="136" rx="8" stroke-width="1"/>
      <text class="d-title" x="532" y="64">one trace</text>
      <text class="d-mono-soft" x="532" y="82">trace_id 4bf92f3577b34da6</text>
      <rect class="d-ok-soft" x="532" y="92" width="184" height="8" rx="3" stroke-width="1"/>
      <rect class="d-ok-soft" x="544" y="106" width="60" height="8" rx="3" stroke-width="1"/>
      <rect class="d-ok-soft" x="544" y="120" width="140" height="8" rx="3" stroke-width="1"/>
      <rect class="d-bad-soft" x="556" y="134" width="70" height="8" rx="3" stroke-width="1"/>
      <text class="d-label" x="532" y="160">every span, from all three services</text>
    </svg>
  </div>
  <figcaption><strong>Nothing here is plumbing you write.</strong> Checkout's outgoing request carries the trace context in a header, each service's auto-instrumentation reads it back out, and any span you open inside that request joins the same trace.</figcaption>
</figure>
