name: observability-lab

x-service-env: &service-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  OTEL_METRIC_EXPORT_INTERVAL_MS: "2000"
  WATCHFILES_FORCE_POLLING: "true"
  PYTHONPATH: /workspace

services:
  lgtm:
    image: grafana/otel-lgtm:0.29.0
    container_name: observability-lab-lgtm
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/checkout-overview.json
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
      - "9090:9090"
    volumes:
      - ./telemetry/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/custom:ro
      - ./telemetry/grafana/provisioning/dashboards/lab.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/lab.yaml:ro
      - ./telemetry/grafana/provisioning/datasources/lab.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/lab.yaml:ro

  inventory:
    image: observability-lab-python:1.0
    container_name: observability-lab-inventory
    working_dir: /workspace/inventory
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      <<: *service-env
      SERVICE_NAME: inventory
    volumes:
      - ./:/workspace
    depends_on:
      lgtm:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health',timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 30

  payment:
    image: observability-lab-python:1.0
    container_name: observability-lab-payment
    working_dir: /workspace/payment
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    environment:
      <<: *service-env
      SERVICE_NAME: payment
    volumes:
      - ./:/workspace
    depends_on:
      lgtm:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health',timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 30

  checkout:
    image: observability-lab-python:1.0
    container_name: observability-lab-checkout
    working_dir: /workspace/checkout
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *service-env
      SERVICE_NAME: checkout
      INVENTORY_URL: http://inventory:8001
      PAYMENT_URL: http://payment:8002
    volumes:
      - ./:/workspace
    ports:
      - "8000:8000"
    depends_on:
      inventory:
        condition: service_healthy
      payment:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 30

  tools:
    image: observability-lab-python:1.0
    working_dir: /workspace
    environment:
      CHECKOUT_URL: http://checkout:8000
      PROMETHEUS_URL: http://lgtm:9090
      TEMPO_URL: http://lgtm:3200
      LOKI_URL: http://lgtm:3100
      GRAFANA_URL: http://lgtm:3000
      PYTHONPATH: /workspace
    volumes:
      - ./:/workspace
    profiles: ["tools"]
    depends_on:
      checkout:
        condition: service_healthy
